<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"historyCacheSize":0}'>
  <title>Memeboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/htmx.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Memeboard</h1>
    <p>Your favorite memes, saved only in this browser.</p>

    <form id="meme-form" hx-post="memes" hx-swap="none">
      <h2>Add a meme</h2>
      <label for="image">Upload an image, or paste one anywhere on this page</label>
      <input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif">
      <small>PNG, JPEG, GIF, WebP or AVIF, up to 3 MiB per image.</small>
      <img id="preview" alt="Selected meme preview" hidden>
      <label for="description">Description (optional)</label>
      <textarea id="description" maxlength="500" rows="3"></textarea>
      <button id="add-button" type="submit">Add meme</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <h2>Saved memes</h2>
    <p id="empty">No memes yet. Upload or paste your first one!</p>
    <section id="memes" aria-label="Saved memes"></section>
    <noscript>Enable JavaScript to use Memeboard.</noscript>
  </main>
</body>
</html>
